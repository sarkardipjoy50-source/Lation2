<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced 3D High-Voltage Surge & Explosion Lab</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #020617; color: #f8fafc; overflow: hidden; }

        /* UI Control Panel Overlay */
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid #334155;
            padding: 15px 25px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 100;
            width: 92%;
            max-width: 650px;
            backdrop-filter: blur(10px);
        }
        h1 { font-size: 19px; color: #f43f5e; text-align: center; font-weight: 700; }
        .control-row { display: flex; align-items: center; gap: 15px; width: 100%; }
        input[type=range] { flex: 1; accent-color: #f43f5e; height: 8px; cursor: pointer; border-radius: 4px; }
        .volt-box { font-size: 24px; font-weight: bold; color: #38bdf8; min-width: 90px; text-align: right; font-family: monospace; }
        
        .btn-group { display: flex; gap: 10px; width: 100%; justify-content: center; flex-wrap: wrap; }
        button { padding: 8px 16px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px; }
        .btn-surge { background: #ef4444; color: white; }
        .btn-surge:hover { background: #dc2626; }
        .btn-short { background: #f59e0b; color: #000; }
        .btn-short:hover { background: #d97706; }
        .btn-reset { background: #3b82f6; color: white; }
        .btn-reset:hover { background: #2563eb; }

        /* Dashboard Status & Logs */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
        }
        .info-card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            font-size: 11px;
        }
        .info-card span { display: block; font-weight: bold; margin-top: 3px; }
        .status-ok { color: #4ade80; }
        .status-dead { color: #f43f5e; }

        #log-box {
            width: 100%;
            background: #090d16;
            border: 1px solid #1e293b;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            color: #94a3b8;
            height: 28px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: center;
        }

        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        /* Instructions hint */
        .hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #94a3b8;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <h1>⚡ Advanced 3D High-Voltage Surge & Explosion Simulation Lab</h1>
        <div class="control-row">
            <label style="font-size: 14px; font-weight: 600;">Main Grid Voltage:</label>
            <input type="range" id="voltageSlider" min="150" max="480" value="220" oninput="onVoltageChange(this.value)">
            <div class="volt-box" id="voltLabel">220V</div>
        </div>

        <div class="btn-group">
            <button class="btn-surge" onclick="triggerLightningSurge()">⚡ 450V Lightning Surge</button>
            <button class="btn-short" onclick="triggerShortCircuit()">🔥 Short Circuit Test</button>
            <button class="btn-reset" onclick="resetSystem()">🔄 Full System Reset</button>
        </div>

        <div class="info-grid">
            <div class="info-card">💡 LED Bulb<span id="stat-bulb" class="status-ok">SAFE</span></div>
            <div class="info-card">📺 Smart TV<span id="stat-tv" class="status-ok">SAFE</span></div>
            <div class="info-card">🧊 Fridge<span id="stat-fridge" class="status-ok">SAFE</span></div>
            <div class="info-card">🖥️ Desktop PC<span id="stat-pc" class="status-ok">SAFE</span></div>
        </div>

        <div id="log-box">সিস্টেম স্বাভাবিক এবং স্থিতিশীল রয়েছে (220V AC Power Active)</div>
    </div>

    <div class="hint">🖱️ মাউস ড্র্যাগ করে থ্রিডি ল্যাব ঘুরিয়ে দেখুন | স্ক্রোল করে জুম করুন</div>

    <div id="canvas-container"></div>

    <!-- Three.js & OrbitControls CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let appliances = {};
        let debrisParticles = [];
        let sparkParticles = [];
        let currentVoltage = 220;
        let audioCtx = null;

        // Appliance configuration with individual failure voltage thresholds
        const deviceConfigs = {
            bulb: { name: "LED Bulb", limit: 250, pos: [-3, 1, 0], destroyed: false },
            tv: { name: "Smart TV", limit: 290, pos: [-1, 1, 0], destroyed: false },
            fridge: { name: "Refrigerator", limit: 340, pos: [1.5, 1.2, 0], destroyed: false },
            pc: { name: "Desktop PC", limit: 380, pos: [3.5, 1.1, 0], destroyed: false }
        };

        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020617, 0.035);

            // Camera Setup
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 9);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Orbit Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // Don't go below ground

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(5, 10, 7);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0x38bdf8, 2, 15);
            pointLight.position.set(0, 4, 2);
            scene.add(pointLight);

            // Lab Floor & Table
            createLabEnvironment();

            // Create 3D Appliances
            createAppliances();

            // Window Resize
            window.addEventListener('resize', onWindowResize);

            // Start Animation Loop
            animate();
        }

        function createLabEnvironment() {
            // Floor Grid
            const grid = new THREE.GridHelper(40, 40, 0xef4444, 0x1e293b);
            grid.position.y = 0;
            scene.add(grid);

            // Workbench Table
            const tableGeo = new THREE.BoxGeometry(10, 0.2, 3);
            const tableMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4, metalness: 0.6 });
            const table = new THREE.Mesh(tableGeo, tableMat);
            table.position.set(0, 0.1, 0);
            table.receiveShadow = true;
            scene.add(table);

            // Table legs
            for(let x of [-4.5, 4.5]) {
                for(let z of [-1.3, 1.3]) {
                    const legGeo = new THREE.CylinderGeometry(0.1, 0.1, 2, 16);
                    const leg = new THREE.Mesh(legGeo, tableMat);
                    leg.position.set(x, -1, z);
                    scene.add(leg);
                }
            }
        }

        function createAppiances() {
            // 1. LED Bulb
            const bulbGroup = new THREE.Group();
            const baseGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.4, 16);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.8 });
            const base = new THREE.Mesh(baseGeo, baseMat);
            
            const glassGeo = new THREE.SphereGeometry(0.35, 16, 16);
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x38bdf8, emissiveIntensity: 0.5, transparent: true, opacity: 0.8 });
            const glass = new THREE.Mesh(glassGeo, glassMat);
            glass.position.y = 0.35;
            
            bulbGroup.add(base, glass);
            bulbGroup.position.set(...deviceConfigs.bulb.pos);
            scene.add(bulbGroup);
            appliances.bulb = { group: bulbGroup, mat: glassMat, type: 'bulb' };

            // 2. Smart TV
            const tvGroup = new THREE.Group();
            const tvBodyGeo = new THREE.BoxGeometry(1.6, 1.0, 0.15);
            const tvMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.8 });
            const tvBody = new THREE.Mesh(tvBodyGeo, tvMat);
            
            const screenGeo = new THREE.PlaneGeometry(1.4, 0.85);
            const screenMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, emissive: 0x0284c7, emissiveIntensity: 0.6 });
            const screen = new THREE.Mesh(screenGeo, screenMat);
            screen.position.z = 0.08;
            
            tvGroup.add(tvBody, screen);
            tvGroup.position.set(...deviceConfigs.tv.pos);
            tvGroup.position.y += 0.5;
            scene.add(tvGroup);
            appliances.tv = { group: tvGroup, mat: screenMat, type: 'tv' };

            // 3. Refrigerator
            const fridgeGroup = new THREE.Group();
            const fBodyGeo = new THREE.BoxGeometry(1.1, 2.0, 0.9);
            const fMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.2, metalness: 0.9 });
            const fridgeBody = new THREE.Mesh(fBodyGeo, fMat);
            fridgeBody.position.y = 1.0;
            fridgeGroup.add(fridgeBody);
            fridgeGroup.position.set(...deviceConfigs.fridge.pos);
            scene.add(fridgeGroup);
            appliances.fridge = { group: fridgeGroup, mat: fMat, type: 'fridge' };

            // 4. Desktop PC
            const pcGroup = new THREE.Group();
            const caseGeo = new THREE.BoxGeometry(0.9, 1.4, 1.3);
            const caseMat = new THREE.MeshStandardMaterial({ color: 0x111827, metalness: 0.7, roughness: 0.3 });
            const pcCase = new THREE.Mesh(caseGeo, caseMat);
            pcCase.position.y = 0.7;
            
            const pcbGeo = new THREE.PlaneGeometry(0.7, 1.1);
            const pcbMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xef4444, emissiveIntensity: 0.3 });
            const sidePanel = new THREE.Mesh(pcbGeo, pcbMat);
            sidePanel.position.set(0.46, 0.7, 0);
            sidePanel.rotation.y = Math.PI / 2;
            
            pcGroup.add(pcCase, sidePanel);
            pcGroup.position.set(...deviceConfigs.pc.pos);
            scene.add(pcGroup);
            appliances.pc = { group: pcGroup, mat: pcbMat, type: 'pc' };
        }

        function onVoltageChange(val) {
            currentVoltage = parseInt(val);
            document.getElementById('voltLabel').innerText = currentVoltage + "V";

            let logBox = document.getElementById('log-box');

            if (currentVoltage > 420) {
                logBox.innerText = "⚠️ এক্সট্রিম হাই ভোল্টেজ! একাধিক ডিভাইসে মারাত্মক বিস্ফোরণ!";
                logBox.style.color = "#f43f5e";
            } else if (currentVoltage > 280) {
                logBox.innerText = "⚠️ ওভারভোল্টেজ ওয়ার্নিং! সার্কিটে অতিরিক্ত উত্তাপ ও স্পার্ক হচ্ছে।";
                logBox.style.color = "#f59e0b";
            } else {
                logBox.innerText = "সিস্টেম স্বাভাবিক এবং স্থিতিশীল রয়েছে (220V AC Power Active)";
                logBox.style.color = "#38bdf8";
            }

            checkDeviceFailures();
            playAudioHum(currentVoltage);
        }

        function checkDeviceFailures() {
            for (let key in deviceConfigs) {
                let dev = deviceConfigs[key];
                let statElem = document.getElementById(`stat-${key}`);

                if (currentVoltage >= dev.limit && !dev.destroyed) {
                    dev.destroyed = true;
                    statElem.innerText = "BLASTED";
                    statElem.className = "info-card status-dead";
                    explodeAppliancePiece(key);
                } else if (currentVoltage < dev.limit && dev.destroyed) {
                    dev.destroyed = false;
                    statElem.innerText = "SAFE";
                    statElem.className = "info-card status-ok";
                    restoreAppliance(key);
                }
            }
        }

        function explodeAppliancePiece(key) {
            let appObj = appliances[key];
            if (!appObj || !appObj.group.parent) return;

            let pos = appObj.group.position.clone();
            scene.remove(appObj.group);

            playExplosionSound();

            // Create Debris Shards
            for (let i = 0; i < 25; i++) {
                const size = Math.random() * 0.15 + 0.03;
                const geo = new THREE.BoxGeometry(size, size, size);
                const mat = new THREE.MeshStandardMaterial({ 
                    color: Math.random() > 0.4 ? 0x334155 : 0xef4444,
                    emissive: 0xff0000 
                });
                const piece = new THREE.Mesh(geo, mat);
                piece.position.copy(pos);
                piece.position.add(new THREE.Vector3((Math.random()-0.5)*0.5, Math.random()*0.5, (Math.random()-0.5)*0.5));
                
                piece.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.2,
                    Math.random() * 0.25 + 0.05,
                    (Math.random() - 0.5) * 0.2
                );

                scene.add(piece);
                debrisParticles.push(piece);
            }
        }

        function restoreAppliance(key) {
            let appObj = appliances[key];
            if (appObj && !appObj.group.parent) {
                scene.add(appObj.group);
            }
        }

        function triggerLightningSurge() {
            document.getElementById('voltageSlider').value = 460;
            onVoltageChange(460);
        }

        function triggerShortCircuit() {
            document.getElementById('voltageSlider').value = 400;
            onVoltageChange(400);
        }

        function resetSystem() {
            document.getElementById('voltageSlider').value = 220;
            onVoltageChange(220);

            // Clear all debris
            debrisParticles.forEach(p => scene.remove(p));
            debrisParticles = [];

            // Restore all devices
            for (let key in deviceConfigs) {
                deviceConfigs[key].destroyed = false;
                document.getElementById(`stat-${key}`).innerText = "SAFE";
                document.getElementById(`stat-${key}`).className = "info-card status-ok";
                restoreAppliance(key);
            }
        }

        // Web Audio API Synthesis for realistic electrical hum & pop
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playAudioHum(volt) {
            try {
                initAudio();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch(e) {}
        }

        function playExplosionSound() {
            try {
                initAudio();
                if(!audioCtx) return;
                
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.4);
                
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } catch(e) {}
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Animate flying debris from explosions
            debrisParticles.forEach(p => {
                p.position.add(p.velocity);
                p.velocity.y -= 0.007; // Gravity
                p.rotation.x += 0.05;
                p.rotation.y += 0.05;
            });

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
